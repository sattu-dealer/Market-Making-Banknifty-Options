# FROZEN EVALUATION PROTOCOL -- BRIEFING §11.4, §18.5, §19.6(3)
#
# Written 2026-09-30, BEFORE any holdout day was run through the market maker.
# Until this file existed, scripts/backtest.py could only run 2026-08-24 and
# 2026-08-25 (hardcoded TARGETS), so no PnL, fill or adverse-selection number
# has ever been computed on a holdout day. `bnfmm.analysis.holdout` enforces the
# split in the loader: a holdout day cannot be read without --unlock-holdout,
# and every unlock is appended to reports/holdout_log.md.
#
# DO NOT EDIT this file after the first unlock. A changed protocol is a new
# protocol: copy it to a new file, say why in DECISIONS.md, and let the log show
# both. The loader records this file's sha256 on every run, so an edit is
# visible in reports/config_log.jsonl. (No git SHA: the repo has no commits yet.)

frozen_at: 2026-09-30

# --- The split ---------------------------------------------------------------
# Walk-forward by CALENDAR DAY, never by segment (§5.5). Proposed in §18.5 on
# 2026-09-04 as develop {Aug 24, 25, 27, 28} / holdout {Aug 31, Sep 1, 2, 3};
# 2026-09-04 was captured after that proposal was written and joins the holdout.
# The holdout is strictly later in time than every development day.
develop:
  - 2026-08-24   # 1 DTE, Aug series
  - 2026-08-25   # 0 DTE, Aug expiry
  - 2026-08-27   # 33 DTE, Sep series
  - 2026-08-28
holdout:
  - 2026-08-31
  - 2026-09-01
  - 2026-09-02
  - 2026-09-03
  - 2026-09-04
excluded:
  2026-08-26: >
    Feed channel received no data at all (HTTP 401 / code 808, BRIEFING §13.12),
    so there is no volume tape and no fill can be simulated. Excluded by the
    feed-coverage rule below, not by judgement.

# The monthly expiry each day quotes into (front series; no weeklies exist).
expiry:
  2026-08-24: 2026-08-25
  2026-08-25: 2026-08-25
  default: 2026-09-29

# --- Inclusion rule, applied mechanically (§19.6 item 3) ---------------------
# Set before any holdout PnL existed. Disclosure: the approximate size of each
# day's capture WAS known when this was written (BRIEFING §9.5/§13.12 list file
# sizes; 2026-09-02 is roughly half a session). The thresholds are deliberately
# loose because analysis is per SEGMENT: a short day contributes fewer round
# trips, it does not need to be dropped. Only a day with no usable tape is out.
session_window_ist: ["09:15:00", "15:30:00"]
inclusion:
  max_gap_s: 30               # a longer gap ends a segment (§5.5)
  min_depth_coverage: 0.25    # fraction of the window inside <=max_gap_s segments
  min_feed_coverage: 0.25     # same, on the quote feed (the tape's only source)

# --- Baseline configuration, carried unchanged from BRIEFING §17.3 -----------
# The first holdout run of any strategy change must also re-run this baseline
# on the same days, so the claim is the increment over it, not a level.
baseline:
  strikes: 1          # ATM only
  leg: both
  lots: 1
  half_spread_ticks: 6
  max_position_lots: 10
  skew_ticks_per_lot: 0.5
  anchor: parity
  queue: pessimistic

# --- Reporting obligations (§18.5) ------------------------------------------
# 1. Every configuration run on any day is appended to reports/config_log.jsonl
#    automatically; the count N is quoted with every result.
# 2. Both brokerage profiles (member, dhan) on every table.
# 3. Spread-capture vs inventory split on every run, and effective AND realised
#    half-spread on every variant (the §18.4 step 2 falsification test).
