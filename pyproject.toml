[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bnfmm"
version = "0.1.0"
description = "Queue-aware execution simulation and market-making study on NSE BANKNIFTY"
requires-python = ">=3.11"
dependencies = [
    "dhanhq>=2.2.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyotp>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "live: requires a broker connection and market hours; skipped by default",
    "master: requires the downloaded instrument master CSV in data/reference/",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
